[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfprop"
version = "1.0.0"
description = "HF / ionospheric propagation prediction and space weather for hams and SWLs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rick Donaldson" }]
requires-python = ">=3.10"
dependencies = ["flet>=1.0,<2"]

[project.optional-dependencies]
desktop = ["flet-desktop>=1.0,<2"]       # window runtime for Linux / Windows / macOS (not for Android)

[project.scripts]
hfprop = "hfprop.cli:main"
hfprop-app = "hfprop_app.main:run"

[tool.setuptools]
packages = ["hfprop", "hfprop_app"]

[tool.setuptools.package-data]
hfprop = ["data/*.json"]

[tool.flet]
product = "HF Propagation"
org = "com.n0njy"
copyright = "HF Propagation"

[tool.flet.app]
exclude = ["tests", "packaging", "tools", "PLAN.md", "README.md", ".git", ".github"]
